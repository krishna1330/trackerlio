@if (currentUser()) {
  <ion-header [translucent]="true" class="custom-app-header">
    <ion-toolbar class="header-toolbar">
      <!-- Top Left: Menu / Back + Trackerlio Title -->
      <ion-buttons slot="start" class="brand-buttons">
        @if (showBackButton) {
          <ion-back-button [defaultHref]="defaultBackHref" class="back-btn"></ion-back-button>
        }
        <ion-menu-button autoHide="false" class="menu-toggle-btn"></ion-menu-button>

        <div class="brand-container" routerLink="/home">
          <div class="brand-logo-icon">
            <ion-icon name="wallet"></ion-icon>
          </div>
          <span class="brand-title">Trackerlio</span>
        </div>

        @if (pageTitle) {
          <span class="page-title-separator">/</span>
          <span class="page-sub-title">{{ pageTitle }}</span>
        }
      </ion-buttons>

      <!-- Top Right: User Profile Icon with User Name & Dropdown Popover -->
      <ion-buttons slot="end" class="user-buttons">
        @if (currentUser(); as user) {
          <!-- Profile Trigger Pill -->
          <button id="user-profile-menu-trigger" type="button" class="profile-trigger-btn">
            <div class="profile-avatar-circle">
              {{ userInitials() }}
            </div>
            <span class="profile-name-text">{{ displayName() }}</span>
            <ion-icon name="chevron-down-outline" class="profile-chevron"></ion-icon>
          </button>

          <!-- Dropdown Popover -->
          <ion-popover
            trigger="user-profile-menu-trigger"
            triggerAction="click"
            [dismissOnSelect]="true"
            side="bottom"
            alignment="end"
            class="custom-profile-popover"
          >
            <ng-template>
              <div class="popover-panel">
                <!-- User Info Card in Dropdown -->
                <div class="popover-header">
                  <div class="popover-avatar">
                    {{ userInitials() }}
                  </div>
                  <div class="popover-user-meta">
                    <span class="popover-name">{{ displayName() }}</span>
                    <span class="popover-email">{{ user.email }}</span>
                  </div>
                </div>

                <div class="popover-divider"></div>

                <!-- Menu Actions -->
                <ion-list lines="none" class="popover-menu-list">
                  <ion-item button routerLink="/home" class="popover-menu-item">
                    <ion-icon slot="start" name="home-outline"></ion-icon>
                    <ion-label>Dashboard</ion-label>
                  </ion-item>

                  <ion-item button routerLink="/expenses" class="popover-menu-item">
                    <ion-icon slot="start" name="receipt-outline"></ion-icon>
                    <ion-label>Expenses</ion-label>
                  </ion-item>

                  @if (isAdmin()) {
                    <ion-item button routerLink="/users" class="popover-menu-item">
                      <ion-icon slot="start" name="people-outline"></ion-icon>
                      <ion-label>Users List</ion-label>
                    </ion-item>
                  }

                  <div class="popover-divider"></div>

                  <ion-item button (click)="onSignOut()" class="popover-menu-item logout-action">
                    <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
                    <ion-label color="danger">Logout</ion-label>
                  </ion-item>
                </ion-list>
              </div>
            </ng-template>
          </ion-popover>
        }
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
}
